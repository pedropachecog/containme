services:
  agent:
    build:
      context: ..
      dockerfile: docker/base.Dockerfile
    working_dir: ${CONTAINME_WORKSPACE_PATH:-/workspace}
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - FORCE_COLOR=1
    volumes:
      - npm-cache:/home/agent/.npm
      - pip-cache:/home/agent/.cache/pip
      - cargo-cache:/home/agent/.cargo/registry
    # Security hardening (H1)
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    # Resource limits (H2 — service-level keys work with docker compose run)
    mem_limit: 8g
    cpus: 4
    pids_limit: 4096
    shm_size: 2gb

volumes:
  npm-cache:
  pip-cache:
  cargo-cache:
